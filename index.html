<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParcelKit — Track Every Delivery in One Place</title>
<meta name="description" content="ParcelKit keeps every parcel you ordered in one place — expected dates, courier tracking, return windows — all on your device.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f8f2e7; --paper2:#efe5d0; --card:#fffdf7; --ink:#2b1d10; --ink2:#6d573d;
  --ink3:#9a8468; --bronze:#a9762f; --amber:#d9a441; --gold:#e8c47c; --terra:#c05b2e;
  --line:#e3d6bd; --line2:#d8c8a8; --sage:#4a7c59; --sagebg:#e6efe7; --red:#b3402a; --redbg:#f9e8e2;
  --amberbg:#fdf3dd; --shadow:0 10px 30px rgba(43,29,16,.10); --shadow2:0 4px 14px rgba(43,29,16,.08);
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif}
img{max-width:100%;display:block}
a{color:var(--bronze)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
::selection{background:var(--gold);color:var(--ink)}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px}
.muted{color:var(--ink2)}
.small{font-size:13px}
svg{display:block}

/* ---------- cinematic intro ---------- */
#intro{position:fixed;inset:0;z-index:200;background:#241708;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f8f2e7;cursor:pointer;transition:opacity .6s ease,visibility .6s}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
#intro .boxmark{width:92px;height:92px;animation:boxIn 1s cubic-bezier(.2,.9,.3,1.2) both}
#intro .boxmark svg{width:100%;height:100%}
@keyframes boxIn{from{transform:translateY(26px) scale(.8);opacity:0}to{transform:none;opacity:1}}
#intro h1{font-size:clamp(44px,9vw,76px);font-weight:900;letter-spacing:.01em;margin-top:18px;line-height:1}
#intro h1 span{display:inline-block;animation:rise .7s cubic-bezier(.2,.8,.3,1) both}
#intro h1 span:nth-child(1){animation-delay:.15s}#intro h1 span:nth-child(2){animation-delay:.22s}
#intro h1 span:nth-child(3){animation-delay:.29s}#intro h1 span:nth-child(4){animation-delay:.36s}
#intro h1 span:nth-child(5){animation-delay:.43s}#intro h1 span:nth-child(6){animation-delay:.50s}
#intro h1 span:nth-child(7){animation-delay:.57s}#intro h1 span:nth-child(8){animation-delay:.64s}
#intro h1 span:nth-child(9){animation-delay:.71s}
@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
#intro p{margin-top:12px;color:#e8c47c;font-size:17px;animation:rise .7s .8s both}
#intro .bar{width:min(300px,70vw);height:3px;background:rgba(248,242,231,.22);border-radius:99px;margin-top:34px;overflow:hidden}
#intro .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--gold));animation:fill 3.6s .3s linear forwards}
@keyframes fill{to{width:100%}}
#intro .skip{margin-top:18px;font-size:13px;color:#cbb593;letter-spacing:.08em;text-transform:uppercase;animation:rise .7s 1s both}

/* ---------- header ---------- */
header.site{position:sticky;top:0;z-index:60;background:rgba(248,242,231,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.site .wrap{display:flex;align-items:center;gap:18px;height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--ink);display:grid;place-items:center;flex:none}
.brand .mark svg{width:21px;height:21px}
.brand b{font-family:'Fraunces',serif;font-size:21px;font-weight:900;letter-spacing:.01em}
.brand b i{font-style:normal;color:var(--bronze)}
nav.main{display:flex;gap:4px;margin-left:auto}
nav.main a{color:var(--ink2);text-decoration:none;font-size:14px;font-weight:600;padding:8px 12px;border-radius:99px}
nav.main a:hover{background:var(--paper2);color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:99px;font-weight:700;font-size:14px;padding:11px 18px;text-decoration:none;transition:transform .15s ease,box-shadow .15s ease}
.btn:active{transform:scale(.97)}
.btn-dark{background:var(--ink);color:#f8f2e7}
.btn-dark:hover{box-shadow:0 8px 20px rgba(43,29,16,.28)}
.btn-gold{background:linear-gradient(135deg,var(--amber),#c98f2e);color:#241708}
.btn-ghost{background:transparent;border:1.5px solid var(--line2);color:var(--ink)}
.btn-ghost:hover{border-color:var(--bronze)}
.btn-sm{padding:8px 13px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;background:#241708;color:#f8f2e7}
.hero .photo{position:absolute;inset:0}
.hero .photo img{width:100%;height:100%;object-fit:cover;animation:kenburns 26s ease-in-out infinite alternate;opacity:.92}
@keyframes kenburns{from{transform:scale(1) translateX(0)}to{transform:scale(1.09) translateX(-1.2%)}}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(36,23,8,.62) 0%,rgba(36,23,8,.42) 45%,rgba(36,23,8,.78) 100%)}
.hero .wrap{position:relative;padding:74px 20px 150px}
.hero .kicker{display:inline-flex;align-items:center;gap:8px;background:rgba(248,242,231,.14);border:1px solid rgba(248,242,231,.35);backdrop-filter:blur(6px);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;letter-spacing:.04em}
.hero h1{font-size:clamp(38px,6.4vw,64px);font-weight:900;line-height:1.06;margin-top:20px;max-width:640px}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero p.lede{margin-top:16px;font-size:18px;color:#efe6d2;max-width:560px}
.hero .cta-row{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.hero .btn-ghost{border-color:rgba(248,242,231,.5);color:#f8f2e7}
.hero .btn-ghost:hover{border-color:var(--gold)}

/* next-delivery card overlapping the hero */
.nextcard{position:relative;z-index:5;margin-top:-118px}
.nextcard .card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px 24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.nextcard .ring{flex:none}
.nextcard .body{flex:1;min-width:220px}
.nextcard .eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--terra)}
.nextcard h2{font-size:26px;font-weight:900;line-height:1.15;margin-top:4px}
.nextcard .meta{margin-top:6px;color:var(--ink2);font-size:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nextcard .actions{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper2);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.chip svg{width:13px;height:13px}
.chip.amber{background:var(--amberbg);border-color:#ecd9a8;color:#7a5510}
.chip.red{background:var(--redbg);border-color:#eec5b8;color:var(--red)}
.chip.green{background:var(--sagebg);border-color:#c4d6c7;color:#33573d}

/* days ring */
.ring{position:relative;width:86px;height:86px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring .n b{font-family:'Fraunces',serif;font-size:26px;font-weight:900}
.ring .n span{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}

/* ---------- stats strip ---------- */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow2)}
.stat b{font-family:'Fraunces',serif;font-size:30px;font-weight:900;display:block;line-height:1.05}
.stat span{font-size:13px;color:var(--ink2);font-weight:600}
.stat.warn b{color:var(--red)}
.stat.good b{color:var(--sage)}

/* ---------- attention banner ---------- */
.attn{margin-top:18px;background:var(--redbg);border:1px solid #eec5b8;border-radius:var(--r);padding:16px 20px;display:flex;gap:14px;align-items:flex-start}
.attn .ico{flex:none;width:38px;height:38px;border-radius:12px;background:#fff;display:grid;place-items:center}
.attn .ico svg{width:20px;height:20px}
.attn h3{font-size:17px}
.attn p{font-size:14px;color:#6d2f22;margin-top:2px}
.attn .btn{margin-left:auto;flex:none}

/* ---------- section heads / filters ---------- */
section.block{margin-top:46px}
.sec-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.sec-head h2{font-size:30px;font-weight:900}
.sec-head .count{font-size:13px;font-weight:700;color:var(--ink2);background:var(--paper2);border:1px solid var(--line);padding:3px 10px;border-radius:99px}
.sec-head p{width:100%;color:var(--ink2);font-size:15px;margin-top:2px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.fchip{border:1.5px solid var(--line2);background:var(--card);border-radius:99px;padding:8px 15px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#f8f2e7}
.fchip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--terra);margin-left:5px;vertical-align:1px}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line2);border-radius:99px;padding:8px 14px;min-width:210px}
.search input{border:none;outline:none;background:transparent;flex:1;font-size:14px;color:var(--ink)}
.search svg{width:16px;height:16px;flex:none}

/* ---------- parcel timeline wall ---------- */
.wall{margin-top:18px;display:flex;flex-direction:column;gap:14px;position:relative}
.wall::before{content:"";position:absolute;left:31px;top:8px;bottom:8px;width:2px;background:repeating-linear-gradient(180deg,var(--line2) 0 8px,transparent 8px 16px)}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow2);padding:18px 20px 16px;display:grid;grid-template-columns:64px 1fr;gap:16px;position:relative}
.pcard.overdue{border-color:#e5b3a4;box-shadow:0 10px 26px rgba(179,64,42,.12)}
.pcard.delivered{opacity:.96}
.pcard .datecol{position:relative;text-align:center;padding-top:2px}
.pcard .datecol .dot{width:16px;height:16px;border-radius:50%;background:var(--amber);border:3px solid var(--paper);box-shadow:0 0 0 2px var(--line2);margin:2px auto 6px}
.pcard.overdue .datecol .dot{background:var(--red)}
.pcard.delivered .datecol .dot{background:var(--sage)}
.pcard .datecol b{font-family:'Fraunces',serif;font-size:26px;font-weight:900;display:block;line-height:1}
.pcard .datecol span{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.pcard .datecol .yr{font-size:11px;color:var(--ink3);font-weight:600}
